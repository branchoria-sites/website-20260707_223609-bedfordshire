    --accent-2: #db2777;
    --accent-3: #ca8a04;
    --accent-4: #65a30d;
    --accent-5: #ea580c;
    --accent-6: #9333ea;
}
:root[data-theme="dark"] {
    --background: #0f172a;
    --panel: #1e293b;
    --primary-text: #f1f5f9;
